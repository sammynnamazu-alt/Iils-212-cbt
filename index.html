<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>ILS 212 CBT</title>
<style>
*{box-sizing:border-box} body{margin:0;font-family:Arial,sans-serif;background:#0b1020;color:#eef2ff}
.app{max-width:720px;margin:auto;min-height:100vh;padding:14px}
.header{background:#151c33;border:1px solid #2b3658;border-radius:18px;padding:16px;margin-bottom:12px;position:sticky;top:8px;z-index:3}
.title{font-size:20px;font-weight:800} .sub{font-size:12px;color:#9aa7c7;margin-top:4px}
.row{display:flex;justify-content:space-between;align-items:center;margin-top:12px;gap:10px}
.timer{font-weight:800;color:#f5d36b} .progress{height:7px;background:#29324d;border-radius:9px;overflow:hidden;margin-top:12px} .bar{height:100%;width:0;background:#6ea8fe}
.card{background:#121a30;border:1px solid #2b3658;border-radius:18px;padding:18px;margin-bottom:12px}
.qnum{font-size:13px;color:#8fa0c5;margin-bottom:10px} .question{font-size:19px;line-height:1.45;font-weight:700}
.option{display:block;width:100%;text-align:left;background:#18223c;border:2px solid #2b3658;color:#eef2ff;border-radius:14px;padding:14px;margin-top:10px;font-size:15px;cursor:pointer}
.option.selected{border-color:#6ea8fe;background:#1d3157}
.letter{font-weight:800;margin-right:8px}
.nav{display:flex;gap:9px} button{font:inherit}
.nav button,.submit,.review{border:0;border-radius:12px;padding:12px 15px;font-weight:800;cursor:pointer}
.nav button{background:#263452;color:#fff} .submit{background:#e0a72f;color:#111;margin-left:auto}
.grid{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;margin-top:14px}
.dot{padding:8px 2px;border-radius:8px;border:1px solid #33405f;background:#18223c;color:#b8c3dd;cursor:pointer;font-size:11px}
.dot.done{background:#244d42;color:#fff} .dot.current{outline:2px solid #6ea8fe}
.modal{position:fixed;inset:0;background:rgba(3,6,15,.88);display:none;align-items:center;justify-content:center;padding:18px;z-index:10}
.modal.show{display:flex} .result{max-width:620px;width:100%;background:#121a30;border:1px solid #33405f;border-radius:20px;padding:22px;max-height:90vh;overflow:auto}
.score{font-size:42px;font-weight:900;margin:8px 0} .muted{color:#9aa7c7} .wrong{padding:12px;border-top:1px solid #2b3658;margin-top:10px}
.hidden{display:none} @media(max-width:500px){.question{font-size:17px}.grid{grid-template-columns:repeat(7,1fr)}}

.reviewHead{display:flex;align-items:center;gap:12px;margin-bottom:16px}.reviewStatus{display:inline-block;padding:7px 11px;border-radius:10px;font-weight:900;font-size:12px}.status-correct{background:#174c35;color:#7ff0b6;border:1px solid #2b8c63}.status-wrong{background:#5b2028;color:#ff9da8;border:1px solid #a9414e}.status-unattempted{background:#3f3820;color:#ffe58b;border:1px solid #8d792c}.reviewQuestion{font-size:18px;line-height:1.45;font-weight:800;margin-bottom:12px}.reviewOption{display:block;width:100%;text-align:left;border:2px solid #2b3658;background:#18223c;color:#eef2ff;border-radius:14px;padding:13px;margin-top:9px;font-size:14px}.reviewOption.correct{border-color:#2b9b68;background:#173b2d}.reviewOption.wrong{border-color:#c94b59;background:#47222a}.reviewLabel{display:block;font-size:11px;font-weight:900;margin-top:6px}.reviewNav{display:flex;justify-content:space-between;gap:10px;margin-top:16px}
</style>
</head>
<body>
<div class="app">
<div class="header">
  <div class="title">ILS 212 • CBT EXAM</div>
  <div class="sub">70 questions • Randomized • Answers hidden until submission</div>
  <div class="row"><span id="counter">Question 1 of 70</span><span class="timer" id="timer">60:00</span></div>
  <div class="progress"><div class="bar" id="bar"></div></div>
</div>
<div class="card">
  <div class="qnum" id="qnum"></div>
  <div class="question" id="question"></div>
  <div id="options"></div>
</div>
<div class="card">
  <div class="row">
    <button class="nav" onclick="prevQ()">◀ Previous</button>
    <button class="nav" onclick="nextQ()">Next ▶</button>
    <button class="submit" onclick="submitExam()">SUBMIT</button>
  </div>
  <div class="sub" style="margin-top:12px">Question navigator</div>
  <div class="grid" id="grid"></div>
</div>
</div>

<div class="modal" id="modal">
 <div class="result">
  <div id="resultTop"><h2>Exam submitted</h2><div class="muted">Your answers have been graded.</div><div class="score" id="score"></div><div id="summary"></div><div class="row" style="justify-content:flex-start;gap:10px;flex-wrap:wrap"><button class="review" onclick="startReview()">🔍 Review Answers</button><button class="submit" style="margin-left:0" onclick="showRetakeConfirm()">🔄 Retake CBT</button></div></div>
  <div id="reviewPanel" class="hidden"><div class="reviewHead"><button class="review" onclick="backToResult()">← Results</button><div><div id="reviewStatus" class="reviewStatus"></div><div class="muted" id="reviewCount"></div></div><button class="submit" style="margin-left:auto" onclick="showRetakeConfirm()">🔄 Retake CBT</button></div><div class="reviewQuestion" id="reviewQuestion"></div><div id="reviewOptions"></div><div class="reviewNav"><button class="review" onclick="reviewPrev()">← Previous</button><button class="review" onclick="reviewNext()">Next →</button></div></div>
 </div>
</div>

<div class="modal" id="confirmModal">
 <div class="result" style="max-width:420px">
  <h2 style="margin-top:0">🔄 Start a new attempt?</h2>
  <p class="muted">Your current answers and score will be cleared. The questions and answer options will be randomized again.</p>
  <div class="row" style="justify-content:flex-end;gap:10px;margin-top:18px">
    <button class="nav" onclick="hideRetakeConfirm()">Cancel</button>
    <button class="submit" style="margin-left:0" onclick="startNewAttempt()">Start New Attempt</button>
  </div>
 </div>
</div>

<script>
const QUESTIONS = [{"id": 1, "q": "Information can best be described as:", "opts": ["Processed data that has meaning and usefulness", "Unprocessed facts only", "Random collection of symbols", "A computer program"], "ans": "C", "ansText": "Processed data that has meaning and usefulness"}, {"id": 2, "q": "The primary purpose of information is to:", "opts": ["Replace human knowledge", "Increase the amount of data available", "Support understanding and decision-making", "Create confusion"], "ans": "A", "ansText": "Support understanding and decision-making"}, {"id": 3, "q": "Which of the following best distinguishes data from information?", "opts": ["Information cannot be stored", "Data is only found in books", "Data is always more useful than information", "Information is processed and organized data"], "ans": "A", "ansText": "Information is processed and organized data"}, {"id": 4, "q": "Information becomes useful when it is:", "opts": ["Presented without context", "Difficult to access", "Hidden", "Meaningful and relevant to a need"], "ans": "D", "ansText": "Meaningful and relevant to a need"}, {"id": 5, "q": "Which of the following is NOT a characteristic of useful information?", "opts": ["Deliberate confusion", "Accuracy", "Relevance", "Timeliness"], "ans": "B", "ansText": "Deliberate confusion"}, {"id": 6, "q": "Information that is available at the appropriate time is said to be:", "opts": ["Biased", "Timely", "Accurate", "Primary"], "ans": "C", "ansText": "Timely"}, {"id": 7, "q": "Which type of information is specifically designed to provide facts about an event?", "opts": ["Fictional information", "Decorative information", "Factual information", "Personal information"], "ans": "A", "ansText": "Factual information"}, {"id": 8, "q": "Information may be classified according to:", "opts": ["Its source and nature", "The age of the reader only", "The size of the library", "The colour of the book containing it"], "ans": "C", "ansText": "Its source and nature"}, {"id": 9, "q": "Which of the following is an example of academic information?", "opts": ["An advertisement without evidence", "An unverified rumour", "A random social media comment", "A peer-reviewed journal article"], "ans": "B", "ansText": "A peer-reviewed journal article"}, {"id": 10, "q": "Information about a person's name, address and occupation may be regarded as:", "opts": ["Bibliographic information", "Statistical information", "Personal information", "Historical information"], "ans": "D", "ansText": "Personal information"}, {"id": 11, "q": "An information source refers to:", "opts": ["Only a university library", "A person who reads books", "A computer used for typing", "A place or material from which information can be obtained"], "ans": "A", "ansText": "A place or material from which information can be obtained"}, {"id": 12, "q": "Which of the following is an information source?", "opts": ["All of the above", "Book", "Database", "Journal"], "ans": "D", "ansText": "All of the above"}, {"id": 13, "q": "The library is important mainly because it:", "opts": ["Stores only entertainment materials", "Provides organized access to information resources", "Replaces classroom teaching", "Prevents students from accessing information"], "ans": "B", "ansText": "Provides organized access to information resources"}, {"id": 14, "q": "Which of the following is a traditional information source?", "opts": ["Social media platform", "Printed book", "Search engine", "Online database"], "ans": "C", "ansText": "Printed book"}, {"id": 15, "q": "Which of the following is an electronic information source?", "opts": ["Manuscript", "Printed newspaper", "Printed encyclopedia", "E-journal"], "ans": "A", "ansText": "E-journal"}, {"id": 16, "q": "A university library catalogue is primarily used to:", "opts": ["Design websites", "Create social media accounts", "Locate library materials", "Write examinations"], "ans": "B", "ansText": "Locate library materials"}, {"id": 17, "q": "Which source is most appropriate for finding scholarly articles?", "opts": ["Gossip blog", "Academic journal database", "Random WhatsApp message", "Entertainment magazine"], "ans": "C", "ansText": "Academic journal database"}, {"id": 18, "q": "A newspaper is generally classified as:", "opts": ["A database management system", "A programming language", "A search algorithm", "An information source"], "ans": "D", "ansText": "An information source"}, {"id": 19, "q": "Which of the following can provide information through direct interaction with a person?", "opts": ["Encyclopedia", "Catalogue", "Dictionary", "Interview"], "ans": "A", "ansText": "Interview"}, {"id": 20, "q": "A reference librarian can assist a student mainly by:", "opts": ["Taking the student's examination", "Helping the student locate and use information resources", "Writing every assignment for the student", "Preventing access to library resources"], "ans": "C", "ansText": "Helping the student locate and use information resources"}, {"id": 21, "q": "The three major categories of information sources are:", "opts": ["Local, national and international", "Primary, secondary and tertiary", "Printed, handwritten and typed", "Old, new and modern"], "ans": "B", "ansText": "Primary, secondary and tertiary"}, {"id": 22, "q": "A primary source provides:", "opts": ["Information without any evidence", "Only summarized information", "Original or first-hand information", "Information copied from an encyclopedia"], "ans": "C", "ansText": "Original or first-hand information"}, {"id": 23, "q": "Which of the following is a primary source?", "opts": ["Researcher's original experiment report", "Textbook summarizing several studies", "Encyclopedia article", "Review article"], "ans": "B", "ansText": "Researcher's original experiment report"}, {"id": 24, "q": "A researcher's laboratory notebook is an example of:", "opts": ["Secondary source", "Fictional source", "Tertiary source", "Primary source"], "ans": "D", "ansText": "Primary source"}, {"id": 25, "q": "Which of the following is most likely a primary source?", "opts": ["Textbook", "Dictionary", "Original interview transcript", "Encyclopedia"], "ans": "A", "ansText": "Original interview transcript"}, {"id": 26, "q": "Secondary sources generally:", "opts": ["Analyze, interpret or discuss primary sources", "Are only handwritten materials", "Contain no information", "Always contain original experimental data"], "ans": "B", "ansText": "Analyze, interpret or discuss primary sources"}, {"id": 27, "q": "Which of the following is an example of a secondary source?", "opts": ["Original interview", "Laboratory observation", "Literature review", "Researcher's diary"], "ans": "C", "ansText": "Literature review"}, {"id": 28, "q": "Tertiary sources are mainly used to:", "opts": ["Compile and organize information from other sources", "Record original experiments", "Conduct interviews", "Produce raw data"], "ans": "B", "ansText": "Compile and organize information from other sources"}, {"id": 29, "q": "Which of the following is commonly considered a tertiary source?", "opts": ["Research report", "Laboratory notebook", "Interview transcript", "Encyclopedia"], "ans": "D", "ansText": "Encyclopedia"}, {"id": 30, "q": "A bibliography that lists sources on a particular subject can serve as a:", "opts": ["Primary source only", "Tertiary information source", "Personal opinion", "Raw data source"], "ans": "B", "ansText": "Tertiary information source"}, {"id": 31, "q": "Which source would be most appropriate for obtaining an original historical document?", "opts": ["Primary source", "Search engine result", "Secondary source", "Tertiary source"], "ans": "C", "ansText": "Primary source"}, {"id": 32, "q": "A textbook written by an author who summarizes the findings of several researchers is primarily a:", "opts": ["Raw source", "Primary source", "Personal source", "Secondary source"], "ans": "A", "ansText": "Secondary source"}, {"id": 33, "q": "Information literacy refers to the ability to:", "opts": ["Use only social media for research", "Find, evaluate, use and communicate information effectively", "Memorize every book in a library", "Avoid information sources"], "ans": "B", "ansText": "Find, evaluate, use and communicate information effectively"}, {"id": 34, "q": "An information-literate student should be able to:", "opts": ["Locate relevant information", "Identify an information need", "All of the above", "Evaluate information"], "ans": "D", "ansText": "All of the above"}, {"id": 35, "q": "Information literacy is important because it enables individuals to:", "opts": ["Accept every piece of information", "Avoid learning", "Depend entirely on rumours", "Make informed decisions"], "ans": "A", "ansText": "Make informed decisions"}, {"id": 36, "q": "Which of the following is NOT an information literacy skill?", "opts": ["Spreading unverified information", "Searching for information", "Evaluating sources", "Using information ethically"], "ans": "C", "ansText": "Spreading unverified information"}, {"id": 37, "q": "Information literacy helps students primarily to:", "opts": ["Depend only on classmates", "Memorize social media posts", "Conduct effective academic research", "Avoid reading"], "ans": "C", "ansText": "Conduct effective academic research"}, {"id": 38, "q": "An information-literate person is able to determine:", "opts": ["How to copy assignments without detection", "Which rumour is most entertaining", "What information is needed and where to find it", "How to avoid credible sources"], "ans": "B", "ansText": "What information is needed and where to find it"}, {"id": 39, "q": "The first step in solving an information problem is usually to:", "opts": ["Ask someone to do the research", "Copy information from the internet", "Print everything available", "Identify the information need"], "ans": "A", "ansText": "Identify the information need"}, {"id": 40, "q": "Information literacy is relevant to:", "opts": ["Everyone who needs to find and use information", "Researchers only", "Librarians only", "Students only"], "ans": "C", "ansText": "Everyone who needs to find and use information"}, {"id": 41, "q": "Which of the following is an area related to information literacy?", "opts": ["Physical literacy", "Media literacy", "Mathematical illiteracy", "Musical literacy"], "ans": "B", "ansText": "Media literacy"}, {"id": 42, "q": "Digital literacy involves the ability to:", "opts": ["Avoid all electronic devices", "Read only printed books", "Memorize computer terminology", "Use digital technologies effectively and responsibly"], "ans": "C", "ansText": "Use digital technologies effectively and responsibly"}, {"id": 43, "q": "Media literacy enables an individual to:", "opts": ["Avoid newspapers completely", "Produce only entertainment content", "Believe every media report", "Understand and critically evaluate media messages"], "ans": "B", "ansText": "Understand and critically evaluate media messages"}, {"id": 44, "q": "Computer literacy mainly refers to the ability to:", "opts": ["Memorize computer history", "Build a computer from scratch", "Repair every computer component", "Use computers and related technologies effectively"], "ans": "A", "ansText": "Use computers and related technologies effectively"}, {"id": 45, "q": "Library literacy involves the ability to:", "opts": ["Read only novels", "Memorize the entire library collection", "Become a professional librarian", "Effectively use library resources and services"], "ans": "C", "ansText": "Effectively use library resources and services"}, {"id": 46, "q": "A student who can search an online database, assess the results and select reliable sources demonstrates:", "opts": ["Physical literacy", "Financial literacy", "Musical literacy", "Information literacy"], "ans": "C", "ansText": "Information literacy"}, {"id": 47, "q": "One major importance of information literacy is that it helps people:", "opts": ["Avoid evidence", "Depend on rumours", "Accept misinformation", "Make better decisions"], "ans": "B", "ansText": "Make better decisions"}, {"id": 48, "q": "Information literacy can help students reduce:", "opts": ["Plagiarism", "Research ability", "Academic performance", "Critical thinking"], "ans": "C", "ansText": "Plagiarism"}, {"id": 49, "q": "A student who properly acknowledges the author of information is demonstrating:", "opts": ["Information avoidance", "Ethical use of information", "Information censorship", "Data destruction"], "ans": "A", "ansText": "Ethical use of information"}, {"id": 50, "q": "Information literacy promotes:", "opts": ["Critical thinking", "Blind acceptance", "Intellectual laziness", "Rumour spreading"], "ans": "D", "ansText": "Critical thinking"}, {"id": 51, "q": "Why is information literacy important in academic research?", "opts": ["It eliminates the need for references", "It encourages copying", "It makes research unnecessary", "It helps researchers identify credible and relevant information"], "ans": "C", "ansText": "It helps researchers identify credible and relevant information"}, {"id": 52, "q": "A major benefit of information literacy in everyday life is:", "opts": ["Avoiding evidence", "Depending on unverified claims", "Increasing misinformation", "Making informed choices"], "ans": "A", "ansText": "Making informed choices"}, {"id": 53, "q": "Information literacy is particularly important in the digital age because:", "opts": ["Everyone produces accurate information", "Information is no longer available", "The volume of available information is very large", "Libraries no longer exist"], "ans": "B", "ansText": "The volume of available information is very large"}, {"id": 54, "q": "Which of the following is a consequence of poor information literacy?", "opts": ["Improved research skills", "Better decision-making", "Better source evaluation", "Increased susceptibility to misinformation"], "ans": "C", "ansText": "Increased susceptibility to misinformation"}, {"id": 55, "q": "Evaluating information means:", "opts": ["Deleting all information", "Judging the quality, credibility and relevance of information", "Reading only the title", "Copying information without checking it"], "ans": "B", "ansText": "Judging the quality, credibility and relevance of information"}, {"id": 56, "q": "Which factor should be considered when evaluating an information source?", "opts": ["Currency", "Authority", "All of the above", "Accuracy"], "ans": "D", "ansText": "All of the above"}, {"id": 57, "q": "The authority of an information source relates to:", "opts": ["The colour of the website", "The expertise or credentials of the author/source", "The length of the article", "The number of pictures"], "ans": "A", "ansText": "The expertise or credentials of the author/source"}, {"id": 58, "q": "The currency of information refers to:", "opts": ["How recent or up-to-date it is", "Its popularity", "Its monetary value", "Its physical size"], "ans": "B", "ansText": "How recent or up-to-date it is"}, {"id": 59, "q": "When evaluating information, accuracy refers to:", "opts": ["Whether the source is colourful", "Whether the information is expensive", "Whether the information is correct and supported by evidence", "Whether it contains many pages"], "ans": "C", "ansText": "Whether the information is correct and supported by evidence"}, {"id": 60, "q": "Relevance means that information:", "opts": ["Is necessarily very old", "Is always lengthy", "Comes from social media", "Directly relates to the information need"], "ans": "B", "ansText": "Directly relates to the information need"}, {"id": 61, "q": "Which question best evaluates the authority of an online article?", "opts": ["Who is the author and what are their qualifications?", "What colour is the webpage?", "Is the font large?", "How many pictures does it contain?"], "ans": "D", "ansText": "Who is the author and what are their qualifications?"}, {"id": 62, "q": "A website containing many claims but providing no evidence should be treated as:", "opts": ["Requiring further verification", "Completely accurate", "A primary source", "Automatically reliable"], "ans": "B", "ansText": "Requiring further verification"}, {"id": 63, "q": "One way to verify information found online is to:", "opts": ["Compare it with credible independent sources", "Trust it because it has many likes", "Accept it because a friend posted it", "Share it immediately"], "ans": "A", "ansText": "Compare it with credible independent sources"}, {"id": 64, "q": "Which of the following is a warning sign that an online source may be unreliable?", "opts": ["Author credentials", "References to credible studies", "Lack of identifiable author and supporting evidence", "Proper citations"], "ans": "C", "ansText": "Lack of identifiable author and supporting evidence"}, {"id": 65, "q": "Which skill enables a student to locate appropriate information efficiently?", "opts": ["Information searching", "Information destruction", "Information hiding", "Information guessing"], "ans": "B", "ansText": "Information searching"}, {"id": 66, "q": "A search strategy involves:", "opts": ["Selecting the first result without evaluation", "Avoiding databases", "Entering random words repeatedly", "Using appropriate keywords and search techniques"], "ans": "A", "ansText": "Using appropriate keywords and search techniques"}, {"id": 67, "q": "Which of the following is most useful when searching an electronic database?", "opts": ["Unrelated words", "Random sentences", "Emojis", "Appropriate keywords"], "ans": "C", "ansText": "Appropriate keywords"}, {"id": 68, "q": "Using information ethically includes:", "opts": ["Citing sources appropriately", "Claiming another person's work as one's own", "Removing the author's name", "Copying without acknowledgement"], "ans": "B", "ansText": "Citing sources appropriately"}, {"id": 69, "q": "Access to information refers to:", "opts": ["Destroying information sources", "The ability or opportunity to obtain needed information", "Memorizing information", "Preventing people from obtaining information"], "ans": "C", "ansText": "The ability or opportunity to obtain needed information"}, {"id": 70, "q": "Which combination best represents the information literacy process?", "opts": ["Identify → Search → Evaluate → Use → Communicate", "Copy → Paste → Submit → Repeat", "Search → Copy → Submit → Forget", "Read → Memorize → Hide → Delete"], "ans": "D", "ansText": "Identify → Search → Evaluate → Use → Communicate"}];
function shuffleArr(arr){
 const a=arr.slice();
 for(let i=a.length-1;i>0;i--){
  const j=Math.floor(Math.random()*(i+1));
  [a[i],a[j]]=[a[j],a[i]];
 }
 return a;
}
function buildAttemptQuestions(){
 return shuffleArr(QUESTIONS).map(q=>({...q, opts:shuffleArr(q.opts)}));
}

let activeQuestions, idx, answers, submitted, seconds, timerId=null;

function render(){
 const x=activeQuestions[idx];
 document.getElementById('counter').textContent=`Question ${idx+1} of ${activeQuestions.length}`;
 document.getElementById('qnum').textContent=`Question ${idx+1}`;
 document.getElementById('question').textContent=x.q;
 const o=document.getElementById('options'); o.innerHTML='';
 x.opts.forEach((text,i)=>{
   const b=document.createElement('button'); b.className='option'+(answers[idx]===text?' selected':'');
   b.innerHTML=`<span class="letter">${String.fromCharCode(65+i)}.</span>${text}`;
   b.onclick=()=>{answers[idx]=text;render();};
   o.appendChild(b);
 });
 document.getElementById('bar').style.width=((idx+1)/activeQuestions.length*100)+'%';
 const g=document.getElementById('grid'); g.innerHTML='';
 activeQuestions.forEach((_,i)=>{
   const b=document.createElement('button'); b.className='dot'+(answers[i]!==null?' done':'')+(i===idx?' current':'');
   b.textContent=i+1; b.onclick=()=>{idx=i;render()};
   g.appendChild(b);
 });
}
function nextQ(){if(idx<activeQuestions.length-1){idx++;render()}}
function prevQ(){if(idx>0){idx--;render()}}
function tick(){
 if(submitted)return;
 seconds=Math.max(0,seconds-1);
 const m=Math.floor(seconds/60),s=seconds%60;
 document.getElementById('timer').textContent=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
 if(seconds===0)submitExam(true);
}
function submitExam(auto=false){
 if(submitted)return;
 const unanswered=answers.filter(x=>x===null).length;
 if(!auto && unanswered>0 && !confirm(`You have ${unanswered} unanswered question(s). Submit anyway?`))return;
 submitted=true; let score=0; activeQuestions.forEach((q,i)=>{if(answers[i]===q.ansText)score++});
 document.getElementById('score').textContent=`${score} / ${activeQuestions.length} (${(score/activeQuestions.length*100).toFixed(1)}%)`;
 document.getElementById('summary').innerHTML=`<p>🟢 Correct: <b>${score}</b> &nbsp; 🔴 Wrong: <b>${activeQuestions.length-score-unanswered}</b> &nbsp; ⚪ Unattempted: <b>${unanswered}</b></p>`;
 document.getElementById('modal').classList.add('show');
}
let reviewIdx=0;
function startReview(){reviewIdx=0;document.getElementById('resultTop').classList.add('hidden');document.getElementById('reviewPanel').classList.remove('hidden');renderReview();}
function backToResult(){document.getElementById('reviewPanel').classList.add('hidden');document.getElementById('resultTop').classList.remove('hidden');}
function renderReview(){
 const q=activeQuestions[reviewIdx], selected=answers[reviewIdx], status=document.getElementById('reviewStatus');
 if(selected===null){status.textContent='⚪ UNATTEMPTED';status.className='reviewStatus status-unattempted';}
 else if(selected===q.ansText){status.textContent='🟢 CORRECT';status.className='reviewStatus status-correct';}
 else{status.textContent='🔴 WRONG';status.className='reviewStatus status-wrong';}
 document.getElementById('reviewCount').textContent=`Question ${reviewIdx+1} of ${activeQuestions.length}`; document.getElementById('reviewQuestion').textContent=q.q;
 const box=document.getElementById('reviewOptions');box.innerHTML='';
 q.opts.forEach((text,i)=>{const b=document.createElement('div');let cls='reviewOption',label=''; if(text===q.ansText){cls+=' correct';label=selected===text?'🟢 YOUR ANSWER • CORRECT':'🟢 CORRECT ANSWER';} if(selected!==null&&text===selected&&text!==q.ansText){cls+=' wrong';label='🔴 YOUR ANSWER';} b.className=cls;b.innerHTML=`<b>${String.fromCharCode(65+i)}.</b> ${text}${label?`<span class="reviewLabel">${label}</span>`:''}`;box.appendChild(b);});
}
function reviewNext(){if(reviewIdx<activeQuestions.length-1){reviewIdx++;renderReview();}}
function reviewPrev(){if(reviewIdx>0){reviewIdx--;renderReview();}}
function closeModal(){document.getElementById('modal').classList.remove('show')}

function showRetakeConfirm(){document.getElementById('confirmModal').classList.add('show');}
function hideRetakeConfirm(){document.getElementById('confirmModal').classList.remove('show');}

function startNewAttempt(){
 activeQuestions=buildAttemptQuestions();
